<ion-content class="register-background">
  <div class="register-container">
    <div class="header-section ion-text-center">
      <ion-icon name="storefront-outline" class="app-logo"></ion-icon>
      <h1>PYMEsoft Móvil</h1>
      <p class="subtitle">Registro de Nuevo Usuario</p>
    </div>

    <div class="register-card">
      <h2 class="card-title ion-text-center">Crear Cuenta</h2>

      <form (ngSubmit)="onRegister()" class="register-form">
        <!-- Nombre -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="person-outline"></ion-icon> Nombre *
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="nombre"
            name="nombre"
            placeholder="ej: Carlos"
            required />
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="person-outline"></ion-icon> Apellido *
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="apellido"
            name="apellido"
            placeholder="ej: Gómez"
            required />
        </div>

        <!-- Tipo Documento -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="card-outline"></ion-icon> Tipo Documento *
          </label>
          <select
            class="custom-select"
            [(ngModel)]="tipoDocumento"
            name="tipoDocumento"
            required>
            <option value="CC">Cédula de Ciudadanía (CC)</option>
            <option value="NIT">NIT (Empresas)</option>
            <option value="CE">Cédula Extranjería (CE)</option>
            <option value="PAS">Pasaporte (PAS)</option>
          </select>
        </div>

        <!-- Número de Documento -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="finger-print-outline"></ion-icon> N° Documento *
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="documento"
            name="documento"
            placeholder="ej: 1098765432"
            required />
        </div>

        <!-- Teléfono -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="call-outline"></ion-icon> Teléfono *
          </label>
          <input
            type="tel"
            class="custom-input"
            [(ngModel)]="telefono"
            name="telefono"
            placeholder="ej: +57 300 1234567"
            required />
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="mail-outline"></ion-icon> Correo Electrónico *
          </label>
          <input
            type="email"
            class="custom-input"
            [(ngModel)]="email"
            name="email"
            placeholder="ej: carlos@pyme.com"
            required />
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="lock-closed-outline"></ion-icon> Contraseña *
          </label>
          <input
            type="password"
            class="custom-input"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required />
        </div>

        <div *ngIf="errorMessage" class="error-message">
          <p><ion-icon name="alert-circle-outline"></ion-icon> {{ errorMessage }}</p>
        </div>

        <button
          type="submit"
          [disabled]="loading || !nombre || !apellido || !tipoDocumento || !documento || !telefono || !email || !password"
          class="submit-button">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Crear Cuenta</span>
        </button>

        <div class="login-link ion-text-center">
          <p>¿Ya tienes una cuenta? <button type="button" class="login-btn-inline" (click)="irALogin()">Inicia Sesión aquí</button></p>
        </div>
      </form>
    </div>
  </div>
</ion-content>
