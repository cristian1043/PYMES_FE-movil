<ion-content class="register-background">
  <div class="register-container">
    <div class="header-section ion-text-center">
      <ion-icon name="storefront-outline" class="app-logo"></ion-icon>
      <h1>PYMEsoft Móvil</h1>
      <p class="subtitle">Registro de Nuevo Usuario</p>
    </div>

    <div class="register-card">
      <h2 class="card-title ion-text-center">Crear Cuenta</h2>

      <form (ngSubmit)="onRegister()" class="register-form">
        <!-- Nombre -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="person-outline"></ion-icon> Nombre *
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="nombre"
            name="nombre"
            placeholder="ej: Carlos"
            required />
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="person-outline"></ion-icon> Apellido *
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="apellido"
            name="apellido"
            placeholder="ej: Gómez"
            required />
        </div>

        <!-- Tipo Documento -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="card-outline"></ion-icon> Tipo Documento *
          </label>
          <select
            class="custom-select"
            [(ngModel)]="tipoDocumento"
            name="tipoDocumento"
            required>
            <option value="CC">Cédula de Ciudadanía (CC)</option>
            <option value="NIT">NIT (Empresas)</option>
            <option value="CE">Cédula Extranjería (CE)</option>
            <option value="PAS">Pasaporte (PAS)</option>
          </select>
        </div>

        <!-- Número de Documento -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="finger-print-outline"></ion-icon> N° Documento *
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="documento"
            name="documento"
            placeholder="ej: 1098765432"
            required />
        </div>

        <!-- Fecha de Nacimiento -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="calendar-outline"></ion-icon> Fecha de Nacimiento *
          </label>
          <input
            type="date"
            class="custom-input"
            [(ngModel)]="fechaNacimiento"
            name="fechaNacimiento"
            (ngModelChange)="onFechaNacimientoChange()"
            required />
          <small *ngIf="edadCalculada" style="color: #3880ff; font-weight: bold; margin-top: 4px; display: block;">
            {{ edadCalculada }}
          </small>
        </div>

        <!-- Lugar de Residencia -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="home-outline"></ion-icon> Lugar de Residencia *
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="lugarResidencia"
            name="lugarResidencia"
            placeholder="ej: Barranquilla, Barrio El Prado"
            required />
        </div>

        <!-- Estado Civil -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="heart-outline"></ion-icon> Estado Civil *
          </label>
          <select
            class="custom-select"
            [(ngModel)]="estadoCivil"
            name="estadoCivil"
            required>
            <option value="Soltero(a)">Soltero(a)</option>
            <option value="Casado(a)">Casado(a)</option>
            <option value="Unión Libre">Unión Libre</option>
            <option value="Divorciado(a)">Divorciado(a)</option>
            <option value="Viudo(a)">Viudo(a)</option>
          </select>
        </div>

        <!-- Número de Hijos -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="people-outline"></ion-icon> Número de Hijos
          </label>
          <input
            type="number"
            class="custom-input"
            [(ngModel)]="numeroHijos"
            name="numeroHijos"
            min="0"
            max="20" />
        </div>

        <!-- Teléfono -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="call-outline"></ion-icon> Teléfono *
          </label>
          <input
            type="tel"
            class="custom-input"
            [(ngModel)]="telefono"
            name="telefono"
            placeholder="ej: +57 300 1234567"
            required />
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="mail-outline"></ion-icon> Correo Electrónico *
          </label>
          <input
            type="email"
            class="custom-input"
            [(ngModel)]="email"
            name="email"
            placeholder="ej: carlos@pyme.com"
            required />
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="lock-closed-outline"></ion-icon> Contraseña *
          </label>
          <input
            type="password"
            class="custom-input"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required />
        </div>

        <!-- Datos Bancarios (Opcional) -->
        <div class="form-group">
          <label class="form-label" style="color: #666; font-size: 0.85rem;">
            <ion-icon name="business-outline"></ion-icon> Banco (Nómina - Opcional)
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="banco"
            name="banco"
            placeholder="ej: Bancolombia, Nequi..." />
        </div>

        <div class="form-group">
          <label class="form-label" style="color: #666; font-size: 0.85rem;">
            <ion-icon name="wallet-outline"></ion-icon> N° Cuenta (Opcional)
          </label>
          <input
            type="text"
            class="custom-input"
            [(ngModel)]="numeroCuenta"
            name="numeroCuenta"
            placeholder="ej: 123456789" />
        </div>

        <div style="background: #f4f5f8; border-radius: 8px; padding: 10px; margin-bottom: 15px; font-size: 0.8rem; color: #555;">
          ℹ️ <strong>Nota:</strong> El sistema te asignará un <strong>@username</strong> único. Con este identificador las empresas podrán vincularte a su equipo.
        </div>

        <div *ngIf="errorMessage" class="error-message">
          <p><ion-icon name="alert-circle-outline"></ion-icon> {{ errorMessage }}</p>
        </div>

        <button
          type="submit"
          [disabled]="loading || !nombre || !apellido || !tipoDocumento || !documento || !telefono || !email || !password || !fechaNacimiento || !lugarResidencia"
          class="submit-button">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Crear Cuenta</span>
        </button>

        <div class="login-link ion-text-center">
          <p>¿Ya tienes una cuenta? <button type="button" class="login-btn-inline" (click)="irALogin()">Inicia Sesión aquí</button></p>
        </div>
      </form>
    </div>
  </div>
</ion-content>
