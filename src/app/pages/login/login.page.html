<ion-content class="login-background">
  <div class="login-container">
    <div class="header-section ion-text-center">
      <ion-icon name="storefront-outline" class="app-logo"></ion-icon>
      <h1>PYMEsoft Móvil</h1>
      <p class="subtitle">Gestión Empresarial en tus Manos</p>
    </div>

    <div class="login-card">
      <h2 class="card-title ion-text-center">Iniciar Sesión</h2>

      <form (ngSubmit)="onLogin()" class="login-form">
        <!-- Usuario o Correo -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="person-outline"></ion-icon> Usuario o Correo
          </label>
          <div class="input-wrapper">
            <input
              type="text"
              class="custom-input"
              [value]="username"
              (input)="onUsernameInput($event)"
              name="username"
              placeholder="ej: admin"
              required />
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label class="form-label">
            <ion-icon name="lock-closed-outline"></ion-icon> Contraseña
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              class="custom-input"
              [value]="password"
              (input)="onPasswordInput($event)"
              name="password"
              placeholder="••••••••"
              required />
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          <p><ion-icon name="alert-circle-outline"></ion-icon> {{ errorMessage }}</p>
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="submit-button">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Ingresar</span>
        </button>

        <div class="register-link ion-text-center">
          <p>¿No tienes una cuenta? <a routerLink="/register" class="register-text">Regístrate aquí</a></p>
        </div>
      </form>
    </div>
  </div>
</ion-content>
