<ion-content class="ion-padding login-background">
  <div class="login-container">
    <div class="header-section ion-text-center">
      <ion-icon name="storefront-outline" class="app-logo"></ion-icon>
      <h1>PYMEsoft Móvil</h1>
      <p class="subtitle">Gestión Empresarial en tus Manos</p>
    </div>

    <ion-card class="login-card ion-padding">
      <ion-card-header>
        <ion-card-title class="ion-text-center">Iniciar Sesión</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="onLogin()">
          <ion-item fill="outline" class="ion-margin-bottom custom-input-item">
            <ion-label position="floating">Usuario o Correo</ion-label>
            <ion-input
              type="text"
              [(ngModel)]="username"
              name="username"
              placeholder="ej: admin">
            </ion-input>
            <ion-icon name="person-outline" slot="start"></ion-icon>
          </ion-item>

          <ion-item fill="outline" class="ion-margin-bottom custom-input-item">
            <ion-label position="floating">Contraseña</ion-label>
            <ion-input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••">
            </ion-input>
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          </ion-item>

          <div *ngIf="errorMessage" class="error-message ion-margin-bottom">
            <ion-text color="danger">
              <p><ion-icon name="alert-circle-outline"></ion-icon> {{ errorMessage }}</p>
            </ion-text>
          </div>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="loading"
            class="login-button ion-margin-top">
            <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
            <span *ngIf="!loading">Ingresar</span>
          </ion-button>

          <div class="register-link ion-text-center ion-margin-top">
            <p>¿No tienes una cuenta? <a routerLink="/register" class="register-text">Regístrate aquí</a></p>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
