<ion-page>
  <!-- Encabezado Corporativo del Index (Sin Botón de Menú) -->
  <ion-header class="custom-app-header">
    <div class="header-content">
      <!-- Título y Logo de la Aplicación -->
      <div class="header-title-container">
        <ion-icon name="storefront-outline" class="header-logo-icon"></ion-icon>
        <span class="header-title-text">PYMEsoft Móvil</span>
      </div>

      <!-- Botón Cerrar Sesión -->
      <button class="header-logout-btn" (click)="logout()" title="Cerrar Sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="logout-label">Salir</span>
      </button>
    </div>
  </ion-header>

  <!-- Contenido de la Pantalla Principal -->
  <ion-content class="inicio-background ion-padding">
    <!-- Header de Bienvenida -->
    <div class="welcome-banner ion-padding ion-margin-bottom" *ngIf="usuario">
      <div class="welcome-text">
        <h2>¡Bienvenido, {{ usuario.nombre || usuario.username }}! 👋</h2>
        <p>Selecciona un módulo para gestionar las operaciones de tu negocio</p>
      </div>
      <ion-badge color="tertiary" class="role-badge">
        {{ usuario.rol || 'Usuario Activo' }}
      </ion-badge>
    </div>

    <!-- Grid de Módulos del Sistema -->
    <div class="modules-section">
      <h3 class="section-title">Módulos del Sistema</h3>

      <div class="modules-grid">
        <div
          *ngFor="let mod of modulosPermitidos"
          class="module-card"
          (click)="irAModulo(mod.url)">
          <div class="module-icon-container" [ngClass]="'color-' + mod.color">
            <ion-icon [name]="mod.icon"></ion-icon>
          </div>
          <div class="module-info">
            <h4 class="module-title">{{ mod.titulo }}</h4>
            <p class="module-desc">{{ mod.descripcion }}</p>
          </div>
          <div class="module-arrow">
            <ion-icon name="chevron-forward-outline"></ion-icon>
          </div>
        </div>
      </div>
    </div>
  </ion-content>
</ion-page>
