<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header class="menu-header">
        <ion-toolbar color="secondary">
          <ion-title>
            <div class="brand-title">
              <ion-icon name="storefront-outline" class="brand-icon"></ion-icon>
              <span>PYMEsoft Móvil</span>
            </div>
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="menu-content">
        <!-- Perfil del Usuario Activo -->
        <div class="user-profile-card ion-padding" *ngIf="usuario">
          <div class="avatar-container">
            <ion-icon name="person-circle-outline" class="user-avatar"></ion-icon>
          </div>
          <div class="user-info">
            <h3 class="user-name">{{ usuario.nombre || usuario.username }}</h3>
            <p class="user-email">{{ usuario.email || 'Sesión Activa' }}</p>
            <ion-badge color="tertiary" class="badge-role">{{ usuario.rol || 'Usuario' }}</ion-badge>
          </div>
        </div>

        <!-- Categorías del Menú -->
        <ion-list *ngFor="let cat of menuCategorias" class="menu-list">
          <ion-list-header class="menu-category-header">{{ cat.titulo }}</ion-list-header>

          <ion-menu-toggle auto-hide="false" *ngFor="let item of cat.items">
            <ion-item routerDirection="root" [routerLink]="[item.url]" lines="none" routerLinkActive="selected" class="menu-item">
              <ion-icon aria-hidden="true" slot="start" [ios]="item.icon + '-outline'" [md]="item.icon + '-sharp'"></ion-icon>
              <ion-label>{{ item.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <!-- Botón de Cerrar Sesión -->
        <div class="logout-section ion-padding-horizontal ion-margin-top" *ngIf="usuario">
          <ion-menu-toggle auto-hide="false">
            <ion-button expand="block" color="danger" fill="outline" (click)="logout()">
              <ion-icon name="log-out-outline" slot="start"></ion-icon>
              Cerrar Sesión
            </ion-button>
          </ion-menu-toggle>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
