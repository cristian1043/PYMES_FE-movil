<ion-app>
  <!-- Fondo Traslúcido de Oscurecimiento (Backdrop Nativo Angular) -->
  <div
    class="custom-side-drawer-backdrop"
    [class.active]="isMenuOpen && !isAuthPage"
    (click)="closeMenu()">
  </div>

  <!-- Panel Deslizable Lateral desde la Izquierda (Side Drawer Overlay Nativo) -->
  <aside
    class="custom-side-drawer-panel"
    [class.open]="isMenuOpen && !isAuthPage">
    <!-- Encabezado del Panel -->
    <div class="drawer-header">
      <div class="drawer-brand">
        <ion-icon name="storefront-outline"></ion-icon>
        <span>PYMEsoft Móvil</span>
      </div>
      <button type="button" class="drawer-close-btn" (click)="closeMenu()" title="Cerrar Menú">
        ✕
      </button>
    </div>

    <!-- Cuerpo del Panel / Lista de Módulos -->
    <div class="drawer-body">
      <!-- Perfil del Usuario y Empresa Activa -->
      <div class="drawer-profile" *ngIf="usuario">
        <ion-icon name="person-circle-outline" class="profile-avatar"></ion-icon>
        <div class="profile-info">
          <h4>{{ usuario.nombre || usuario.username }}</h4>
          <p>{{ usuario.email || 'Sesión Activa' }}</p>
          <div class="profile-badges">
            <ion-badge color="tertiary" class="badge-role">
              {{ (empresaActiva && empresaActiva.rol_nombre) ? empresaActiva.rol_nombre : (usuario.rol || 'Usuario') }}
            </ion-badge>
            <ion-badge color="primary" class="badge-empresa" *ngIf="empresaActiva" (click)="navegar('/seleccionar-empresa')">
              🏢 {{ empresaActiva.nombre }}
            </ion-badge>
          </div>
        </div>
      </div>

      <!-- Menú por Categorías -->
      <div *ngFor="let cat of menuCategoriasPermitidas" class="drawer-menu-category">
        <div class="category-title">{{ cat.titulo }}</div>

        <div
          *ngFor="let item of cat.items"
          class="drawer-menu-item"
          (click)="navegar(item.url)">
          <ion-icon [name]="item.icon"></ion-icon>
          <span>{{ item.title }}</span>
        </div>
      </div>
    </div>

    <!-- Pie del Panel / Cerrar Sesión -->
    <div class="drawer-footer" *ngIf="usuario">
      <button type="button" class="btn-logout" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Outlet Principal de la Aplicación -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
