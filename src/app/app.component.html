<ion-app>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" menuId="main-menu" [disabled]="!usuario">
      <ion-header class="menu-header">
        <ion-toolbar color="secondary">
          <ion-title>
            <div class="brand-title">
              <ion-icon name="storefront-outline" class="brand-icon"></ion-icon>
              <span>PYMEsoft Móvil</span>
            </div>
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="menu-content" scroll-y="true">
        <!-- Perfil del Usuario Activo -->
        <div class="user-profile-card ion-padding" *ngIf="usuario">
          <div class="avatar-container">
            <ion-icon name="person-circle-outline" class="user-avatar"></ion-icon>
          </div>
          <div class="user-info">
            <h3 class="user-name">{{ usuario.nombre || usuario.username }}</h3>
            <p class="user-email">{{ usuario.email || 'Sesión Activa' }}</p>
            <ion-badge color="tertiary" class="badge-role">{{ usuario.rol || 'Usuario' }}</ion-badge>
          </div>
        </div>

        <!-- Categorías del Menú según Rol -->
        <div class="menu-list-container">
          <ion-list *ngFor="let cat of menuCategoriasPermitidas" class="menu-list">
            <ion-list-header class="menu-category-header">{{ cat.titulo }}</ion-list-header>

            <ion-item
              *ngFor="let item of cat.items"
              button
              (click)="navegar(item.url)"
              lines="none"
              routerLinkActive="selected"
              class="menu-item">
              <ion-icon aria-hidden="true" slot="start" [name]="item.icon"></ion-icon>
              <ion-label>{{ item.title }}</ion-label>
            </ion-item>
          </ion-list>
        </div>

        <!-- Botón de Cerrar Sesión -->
        <div class="logout-section ion-padding-horizontal ion-margin-top ion-margin-bottom" *ngIf="usuario">
          <ion-button expand="block" color="danger" fill="outline" (click)="logout()">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            Cerrar Sesión
          </ion-button>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
